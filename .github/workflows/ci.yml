name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    permissions:
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Install Rust
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm audit --audit-level=moderate
      - run: cargo +1.97.0 fmt --check --manifest-path engine/Cargo.toml
      - run: cargo +1.97.0 clippy --locked --manifest-path engine/Cargo.toml -- -D warnings
      - run: cargo +1.97.0 test --locked --manifest-path engine/Cargo.toml
      - run: npm run build:worker
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Test release policy
        run: python3 tests/release-policy.test.py
      - name: Package Marketplace pre-release
        run: npm run package -- --pre-release
      - name: Verify Marketplace package
        run: python3 scripts/verify-package.py --pre-release
      - name: Generate dependency inventory
        run: python3 scripts/sbom.py artifacts/dependencies.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: vsix-${{ matrix.os }}
          path: |
            artifacts/*.vsix
            artifacts/dependencies.cdx.json
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency and workflow security
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned workflow scanner
        env:
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/zizmor.tar.gz"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      - name: Audit workflows
        run: '"$RUNNER_TEMP/zizmor" --offline --strict-collection --persona pedantic .github'
      - name: Install pinned secret scanner
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed source for secrets
        run: |
          mkdir "$RUNNER_TEMP/source-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-scan"
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact "$RUNNER_TEMP/source-scan"
      - name: Install pinned Rust audit tool
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 install cargo-audit --version 0.22.2 --locked
      - run: cargo +1.97.0 audit --file engine/Cargo.lock --deny warnings

  provenance:
    name: Attest trusted main artifacts
    needs: [check, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'cyprienc/shift-shift'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Download artifacts from this workflow run only.
      id-token: write # Obtain a short-lived identity for Sigstore signing.
      attestations: write # Store artifact provenance; no repository-content write permission.
      contents: read
    steps:
      # No checkout, dependency installation or repository code execution in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vsix-*
          path: artifacts
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/**/*.vsix
            artifacts/**/dependencies.cdx.json
