[package]
name = "shift-shift-worker"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[dependencies]
ruff_python_parser = "=0.0.17"
ruff_python_ast = "=0.0.18"
ruff_text_size = "=0.0.17"
rayon = "=1.12.0"
nucleo-matcher = "=0.3.1"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
walkdir = "=2.5.0"
globset = "=0.4.20"
redb = "=4.3.0"
encoding_rs = "=0.8.42"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
